name: Deploy to AWS (S3 + ECR + ECS)

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 1. Configurar credenciales de AWS
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: eu-south-2 # Cambia a tu región si es distinta

            # 2. Subir los archivos estáticos a S3 (Opcional pero recomendado)
            - name: Sync static files to S3
              run: |
                  aws s3 sync . s3://javierdz-web-static --exclude ".git/*" --exclude ".github/*" --exclude "Dockerfile"

            # 3. Login en Amazon ECR
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            # 4. Construir y subir la imagen Docker a ECR (forzando arquitectura amd64)
            - name: Build, tag, and push image to Amazon ECR
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: javierdz-dev
                  IMAGE_TAG: latest
              run: |
                  docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 5. Forzar un nuevo despliegue en ECS Fargate para que coja la imagen nueva
            - name: Force ECS Deployment
              run: |
                  aws ecs update-service --cluster javierdz-web-prod --service javierdz-web-prod-service --force-new-deployment