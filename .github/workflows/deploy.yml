name: Deploy Web to Azure File Share

on:
  push:
    branches:
      - main  # Se ejecuta automáticamente al hacer push a la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Azure usando el secreto guardado
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Subir/sincronizar los archivos web en Azure Files
      - name: Upload files to Azure Storage File Share
        run: |
          az storage file upload-batch \
            --account-name stjavierprod \
            --destination nginx-site \
            --source . \
            --pattern "*" \
            --exclude-path ".git* .github*"

      # 4. Recargar Nginx en el contenedor ACI (opcional, para refrescar cache)
      - name: Reload Nginx Container
        run: |
          az container exec \
            --resource-group rg-javierdz-prod-francecentral \
            --name aci-javierdz-nginx-prod \
            --exec-command "nginx -s reload" || true